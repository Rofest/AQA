plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
    id("io.freefair.lombok") version "9.7.0"

}

repositories {
    mavenCentral()
}

def allureAdapterVersion = '2.35.2'

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.codeborne:selenide:7.16.2'
    testImplementation 'net.datafaker:datafaker:2.4.2'
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    implementation 'io.qameta.allure:allure-rest-assured:2.35.5'
    implementation 'tools.jackson.core:jackson-databind:3.2.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    implementation 'io.qameta.allure:allure-assertj:2.35.5'
}

allure {
    version = '2.42.1'

    adapter {
        aspectjWeaver.set(true)
        allureJavaVersion.set(allureAdapterVersion)

        frameworks {
            junit5
        }
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
}